
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native JavaScript vs jQuery</title>

    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>

    <h1>Native JavaScript vs jQuery</h1>

    <div id="myElement">Original Text</div>

    <br>

    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <br>

    <button id="myButton">Click me</button>

    <script>
        // (a) Change text using jQuery
        $("#myElement").text("Modified Text");

        // (b) Add CSS class using jQuery
        $("#myDIV").addClass("myStyle");

        // (c) Handle button click using jQuery
        $("#myButton").on("click", function() {
            alert("Button clicked!");
        });
    </script>

</body>
</html>
